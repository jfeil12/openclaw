services:
  - type: web
    name: openclaw
    runtime: docker
    plan: free
    healthCheckPath: /health
    startCommand: bash scripts/render-start.sh
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENCLAW_STATE_DIR
        value: /app/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /app/workspace
      - key: OPENCLAW_GATEWAY_BIND
        value: lan
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
    # disk:
    #   name: openclaw-data
    #   mountPath: /data
    #   sizeGB: 1
